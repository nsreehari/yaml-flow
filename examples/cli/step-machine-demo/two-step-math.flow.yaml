id: two-step-math
settings:
  start_step: step1_add
  max_total_steps: 10
  timeout_ms: 10000

steps:
  step1_add:
    description: Compute c = a + b
    expects_data: [a, b]
    produces_data: [c]
    input_validations:
      - $type(a) = "number"
      - $type(b) = "number"
    handler:
      type: compute-jsonata
      expr:
        - data.c = expects_data.a + expects_data.b
    transitions:
      success: step2_double
      failure: failed_state

  step2_double:
    description: Compute d = c * 2
    expects_data: [c]
    produces_data: [d]
    input_validations:
      - $type(c) = "number"
    handler:
      type: compute-jsonata
      expr:
        - data.d = expects_data.c * 2
    transitions:
      success: success_state
      failure: failed_state

terminal_states:
  success_state:
    return_intent: success
    return_artifacts: [a, b, c, d]

  failed_state:
    return_intent: failure
    return_artifacts: [error]
